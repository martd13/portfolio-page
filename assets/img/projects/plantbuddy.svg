<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <style>
    .drop { animation: fall 2.4s ease-in infinite; }
    .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.6s; }
    .leaf { transform-origin: 240px 190px; animation: sway 4s ease-in-out infinite; }
    @keyframes fall { 0% { transform: translateY(-14px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(40px); opacity: 0; } }
    @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .drop, .leaf { animation: none; } }
  </style>
  <rect width="480" height="300" fill="#e1efeb"/>
  <circle cx="400" cy="60" r="90" fill="#f6f5f1" opacity=".7"/>
  <!-- Kalender -->
  <g transform="translate(330 150)">
    <rect width="110" height="100" rx="10" fill="#fff" stroke="#1c1f24" stroke-width="3"/>
    <rect width="110" height="24" rx="10" fill="#0f6e5c"/>
    <rect y="14" width="110" height="10" fill="#0f6e5c"/>
    <g fill="#e1efeb">
      <rect x="12" y="36" width="20" height="18" rx="4"/><rect x="45" y="36" width="20" height="18" rx="4"/><rect x="78" y="36" width="20" height="18" rx="4"/>
      <rect x="12" y="66" width="20" height="18" rx="4"/><rect x="45" y="66" width="20" height="18" rx="4"/><rect x="78" y="66" width="20" height="18" rx="4"/>
    </g>
    <path d="M16 45l5 5 8-10M49 75l5 5 8-10" fill="none" stroke="#0f6e5c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="88" cy="75" r="7" fill="#e8a33d"/>
  </g>
  <!-- Giesskanne -->
  <g transform="translate(70 70)">
    <path d="M10 30h70l-8 55H18z" fill="#e8a33d" stroke="#1c1f24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80 40l55-25" stroke="#1c1f24" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 40l55-25" stroke="#e8a33d" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 30c0-25 50-25 50 0" fill="none" stroke="#1c1f24" stroke-width="3"/>
  </g>
  <g fill="#0f6e5c">
    <path class="drop" d="M210 110c-4 6-6 9-6 12a6 6 0 0 0 12 0c0-3-2-6-6-12z"/>
    <path class="drop d2" d="M226 100c-4 6-6 9-6 12a6 6 0 0 0 12 0c0-3-2-6-6-12z"/>
    <path class="drop d3" d="M242 112c-4 6-6 9-6 12a6 6 0 0 0 12 0c0-3-2-6-6-12z"/>
  </g>
  <!-- Pflanze -->
  <g class="leaf">
    <path d="M240 200V150" stroke="#0a5245" stroke-width="4"/>
    <path d="M240 170c-30-5-40-30-38-45 20 0 38 15 38 45z" fill="#0f6e5c"/>
    <path d="M240 160c25-5 38-28 36-42-20 2-36 15-36 42z" fill="#2e8f78"/>
  </g>
  <path d="M200 200h80l-10 60h-60z" fill="#fff" stroke="#1c1f24" stroke-width="3" stroke-linejoin="round"/>
  <rect x="194" y="194" width="92" height="14" rx="4" fill="#1c1f24"/>
</svg>
