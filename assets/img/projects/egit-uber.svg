<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <style>
    .glow { transform-origin: 240px 150px; animation: glow 3s ease-in-out infinite; }
    .scan { animation: scan 3s ease-in-out infinite; }
    @keyframes glow { 0%,100% { transform: scale(1); opacity: .25; } 50% { transform: scale(1.12); opacity: .5; } }
    @keyframes scan { 0%,100% { transform: translateY(0); } 50% { transform: translateY(60px); } }
    @media (prefers-reduced-motion: reduce) { .glow, .scan { animation: none; } }
  </style>
  <rect width="480" height="300" fill="#e1efeb"/>
  <!-- Organigramm -->
  <g stroke="#0a5245" stroke-width="3" fill="none">
    <path d="M70 120v-30h60v30M100 90V70"/>
    <path d="M350 120v-30h60v30M380 90V70"/>
  </g>
  <g fill="#fff" stroke="#1c1f24" stroke-width="3">
    <rect x="84" y="46" width="32" height="24" rx="4"/>
    <rect x="54" y="120" width="32" height="24" rx="4"/>
    <rect x="114" y="120" width="32" height="24" rx="4"/>
    <rect x="364" y="46" width="32" height="24" rx="4"/>
    <rect x="334" y="120" width="32" height="24" rx="4"/>
    <rect x="394" y="120" width="32" height="24" rx="4"/>
  </g>
  <!-- Waage -->
  <g transform="translate(100 210)" stroke="#1c1f24" stroke-width="3" fill="none">
    <path d="M0 0v50M-35 0h70M-25 50h50"/>
    <path d="M-35 0l-12 25h24zM35 0l-12 25h24z" fill="#e8a33d"/>
  </g>
  <!-- Checkliste -->
  <g transform="translate(345 190)">
    <rect width="70" height="80" rx="8" fill="#fff" stroke="#1c1f24" stroke-width="3"/>
    <path d="M14 22l5 5 9-10M14 46l5 5 9-10" stroke="#0f6e5c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M36 22h22M36 46h22M36 66h22" stroke="#dcdad3" stroke-width="4" stroke-linecap="round"/>
    <rect class="scan" x="6" y="8" width="58" height="4" rx="2" fill="#e8a33d" opacity=".8"/>
  </g>
  <!-- Schild -->
  <circle class="glow" cx="240" cy="150" r="80" fill="#0f6e5c"/>
  <path d="M240 82l58 22v40c0 40-26 64-58 76-32-12-58-36-58-76v-40z" fill="#0f6e5c" stroke="#1c1f24" stroke-width="4" stroke-linejoin="round"/>
  <path d="M214 150l18 18 34-38" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
