<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <style>
    .ticket { animation: move 6s ease-in-out infinite; }
    @keyframes move { 0% { transform: translateX(0); } 30% { transform: translateX(150px); } 45% { transform: translateX(150px); } 75% { transform: translateX(300px); } 100% { transform: translateX(300px); } }
    @media (prefers-reduced-motion: reduce) { .ticket { animation: none; } }
  </style>
  <rect width="480" height="300" fill="#f6f5f1"/>
  <path d="M90 170h300" stroke="#dcdad3" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round"/>
  <!-- Schritte -->
  <g stroke="#1c1f24" stroke-width="3">
    <circle cx="90" cy="170" r="36" fill="#fff"/>
    <rect x="204" y="134" width="72" height="72" rx="12" fill="#fff"/>
    <circle cx="390" cy="170" r="36" fill="#0f6e5c"/>
  </g>
  <!-- Headset -->
  <path d="M74 176v-8a16 16 0 0 1 32 0v8" fill="none" stroke="#0f6e5c" stroke-width="5"/>
  <rect x="70" y="172" width="9" height="15" rx="3" fill="#0f6e5c"/>
  <rect x="101" y="172" width="9" height="15" rx="3" fill="#0f6e5c"/>
  <!-- Zahnrad -->
  <g transform="translate(240 170)" fill="#e8a33d">
    <circle r="16"/>
    <g stroke="#e8a33d" stroke-width="8"><path d="M0-26v52M-26 0h52M-18-18l36 36M18-18l-36 36"/></g>
    <circle r="7" fill="#fff"/>
  </g>
  <path d="M374 170l11 11 20-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ticket -->
  <g class="ticket">
    <rect x="62" y="70" width="56" height="38" rx="6" fill="#e1efeb" stroke="#0f6e5c" stroke-width="3"/>
    <path d="M72 84h36M72 95h22" stroke="#0f6e5c" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g font-family="monospace" font-size="13" fill="#5a606b" text-anchor="middle">
    <text x="90" y="236">Anfrage</text>
    <text x="240" y="236">Bearbeitung</text>
    <text x="390" y="236">Gelöst</text>
  </g>
</svg>
